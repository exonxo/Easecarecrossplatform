<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1975D2" />
    <meta name="description" content="EaseCare — Home care services at your doorstep. Verified caregivers, fair pricing, only 10% platform fee." />

    <!-- Preload above-the-fold hero image — improves LCP ~150ms -->
    <link rel="preload" as="image" href="/hero-pricing-panel.webp" type="image/webp" fetchpriority="high" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/easecarelogo-logomark.svg" />
    <link rel="apple-touch-icon" href="/easecarelogo-logomark.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EaseCare" />

    <!-- Open Graph -->
    <meta property="og:title" content="EaseCare — Home Care That Feels Like Family" />
    <meta property="og:description" content="Verified caregivers at your doorstep. Better pricing for every home — only 10% platform fee." />
    <meta property="og:image" content="/easecarelogo-fulllogo-horizontal.svg" />
    <meta property="og:type" content="website" />

    <title>EaseCare — Home Care at Your Doorstep</title>

    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Razorpay Checkout SDK — loaded at app level so window.Razorpay is always
         available without per-component race conditions (matches ease-care-ui-design). -->
    <script async src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
